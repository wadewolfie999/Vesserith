name: Publish verified GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out verified main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate canonical inputs
        run: |
          npm run validate:registry
          npm test
          npm run verify:public
          npm run lint

      - name: Refresh derived GitHub snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run refresh:github

      - name: Configure build provenance
        run: |
          echo "VESSERITH_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "VESSERITH_SOURCE_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "VESSERITH_BUILD_ENVIRONMENT=github-pages" >> "$GITHUB_ENV"
          echo "VESSERITH_BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          echo "VESSERITH_PUBLIC_ORIGIN=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      - name: Build static Pages artifact
        run: npm run build:pages

      - name: Verify static Pages artifact
        run: npm run verify:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
